脈拍が 145/分 になった","収縮期血圧が運動前より 15 mmHg 上がった","呼吸数が 20/分 になった","軽く汗ばんできた"],answerIndex:0,explanation:"途中で中止する基準には、脈拍 140/分 を超えた場合、運動時収縮期血圧が 40 mmHg 以上(拡張期 20 mmHg 以上)上昇した場合、頻呼吸(30回/分以上)、中等度以上の呼吸困難・めまい・嘔気・狭心痛・強い疲労感、不整脈の増加、徐脈の出現、意識状態の悪化などがあります。",choiceNotes:["正解。脈拍 140/分 を超えたら中止します。","中止の目安は 40 mmHg 以上の上昇。15 mmHg では該当しません。","中止の目安は 30回/分 以上の頻呼吸。20/分は該当しません。","軽い発汗は運動に伴う正常な反応です。冷汗・顔面蒼白なら要注意です。"],reference:"日本リハビリテーション医学会「リハビリテーション医療における安全管理・推進のためのガイドライン」"},{id:"risk-003",category:"リスク管理",question:"起立性低血圧の診断基準として正しいものはどれか。",choices:["起立後 3分以内に収縮期血圧が 20 mmHg 以上低下する","起立後 10分以内に収縮期血圧が 10 mmHg 以上低下する","起立直後に脈拍が 10/分 以上増加する","起立後 3分以内に拡張期血圧が 5 mmHg 以上低下する"],answerIndex:0,explanation:"起立性低血圧は、起立(または head-up tilt)後 3分以内に収縮期血圧が 20 mmHg 以上、または拡張期血圧が 10 mmHg 以上低下するものと定義されます。急性期の離床時は、臥位・座位・立位で血圧を測り、症状(めまい、眼前暗黒感、あくび、顔面蒼白)も合わせて観察します。",choiceNotes:["正解。収縮期 20 mmHg 以上、または拡張期 10 mmHg 以上の低下が基準です。","時間も低下幅も基準と違います。","脈拍の増加は診断基準ではありません(体位性頻脈症候群では 30/分以上の増加が目安)。","拡張期の基準は 10 mmHg 以上の低下です。"],reference:"Freeman R, et al. Consensus statement on the definition of orthostatic hypotension (2011)"},{id:"cva-001",category:"脳血管疾患",question:"脳卒中治療ガイドライン2021における急性期リハビリテーションの考え方として正しいものはどれか。",choices:["発症後24時間以内に、高頻度・長時間の離床訓練を始めることが勧められる","十分なリスク管理のもと、発症後できるだけ早期から積極的なリハを行うことが勧められる","急性期は安静を優先し、離床は発症2週間後から始める","セルフケア訓練は回復期病棟に移ってから始める"],answerIndex:1,explanation:"ガイドラインでは、十分なリスク管理のもとで、早期座位・立位、装具を使った早期歩行訓練、摂食嚥下訓練、セルフケア訓練などを含む積極的なリハを、発症後できるだけ早期から行うことが勧められています。一方、AVERT試験の結果から、発症後24時間以内に高頻度・長時間の離床訓練を始めることは勧められていません。",choiceNotes:["AVERT試験で転帰が悪化したため、勧められていません。","正解。「早期から、ただしリスク管理のもとで」がポイントです。","長期の安静は廃用症候群を招くため、勧められません。","セルフケア訓練も急性期から行うことが勧められています。"],reference:"日本脳卒中学会「脳卒中治療ガイドライン2021」/ AVERT Trial Collaboration (Lancet 2015)"},{id:"cva-002",category:"脳血管疾患",question:"左半側空間無視が最も生じやすい損傷部位はどれか。",choices:["左前頭葉","右頭頂葉","小脳","左後頭葉"],answerIndex:1,explanation:"半側空間無視は右半球損傷、特に右頭頂葉(下頭頂小葉)や側頭頭頂接合部の損傷で、損傷と反対側の左側に起こることが多く、重症で長く続きやすい傾向があります。評価には線分二等分試験、線分抹消試験、BIT(行動性無視検査)などを使います。",choiceNotes:["左半球損傷では失語・失行が目立ちます。右側の無視は起きても軽いことが多いです。","正解。右頭頂葉損傷による左半側空間無視が代表的です。","小脳損傷では運動失調が中心です。","後頭葉損傷では同名半盲などの視野障害が起こります(無視とは別の症状)。"],reference:"石合純夫『高次脳機能障害学』/ BIT 行動性無視検査 日本版"},{id:"cva-003",category:"脳血管疾患",question:"くも膜下出血の後に脳血管攣縮が起こりやすい時期はどれか。",choices:["発症当日","発症後 4〜14日","発症後 3〜4週","発症後 2か月以降"],answerIndex:1,explanation:"脳血管攣縮は、くも膜下出血の発症後 4〜14日ごろ(ピークは 7〜10日ごろ)に起こりやすく、遅発性脳虚血の原因になります。この時期は意識レベル・麻痺・失語などの神経症状の変化に注意し、離床の進め方は主治医と相談して決めます。",choiceNotes:["発症当日〜早期は再出血に注意する時期です。","正解。4〜14日が攣縮期です。","攣縮期は過ぎていることが多い時期です。","この時期は正常圧水頭症(歩行障害・認知障害・尿失禁)の発症に注意します。"],reference:"日本脳卒中学会「脳卒中治療ガイドライン2021」"},{id:"ortho-001",category:"運動器疾患",question:"後方アプローチによる人工股関節全置換術(THA)の後、脱臼しやすい肢位はどれか。",choices:["屈曲・内転・内旋","伸展・内転・外旋","屈曲・外転・外旋","伸展・外転・内旋"],answerIndex:0,explanation:"後方アプローチでは後方の関節包・短外旋筋群を切開するため、股関節の深い屈曲・内転・内旋で後方に脱臼しやすくなります。低い椅子に座る、しゃがむ、脚を組む、内股で靴下をはくなどの動作に注意し、ADL指導(長柄の靴べら・ソックスエイドなどの自助具)を行います。",choiceNotes:["正解。後方脱臼の肢位です。","前方アプローチで注意する肢位(前方脱臼)です。","屈曲は危険ですが、外転・外旋は後方脱臼を防ぐ向きです。","脱臼肢位の組み合わせではありません。"],reference:"日本整形外科学会「変形性股関節症診療ガイドライン」ほか"},{id:"ortho-002",category:"運動器疾患",question:"前方アプローチによるTHAの後、脱臼に注意すべき肢位はどれか。",choices:["屈曲・内転・内旋","伸展・内転・外旋","屈曲・外転・内旋","軽度屈曲・中間位"],answerIndex:1,explanation:"前方アプローチでは前方の関節包を切開するため、股関節の伸展・内転・外旋で前方に脱臼しやすくなります。後方アプローチに比べて脱臼は少ないとされますが、振り向き動作や、ベッド上で脚を伸ばしたまま外にねじる動作に注意します。",choiceNotes:["後方アプローチで注意する肢位です。","正解。前方脱臼の肢位です。","脱臼肢位の組み合わせではありません。","比較的安全な肢位です。"],reference:"日本整形外科学会「変形性股関節症診療ガイドライン」ほか"},{id:"ortho-003",category:"運動器疾患",question:"高齢者の大腿骨頸部骨折(Garden分類 stage III・IV)に対して一般的に選ばれる手術はどれか。",choices:["骨接合術(ハンソンピンなど)","人工骨頭置換術","保存療法","髄内釘固定術"],answerIndex:1,explanation:"Garden III・IV は転位型の骨折で、骨頭への血流が途絶えやすく、骨癒合の遅れや骨頭壊死が起こりやすいため、高齢者では人工物置換術(人工骨頭置換術など)が一般的です。非転位型(Garden I・II)では骨接合術が選ばれることが多いです。術後は早期から荷重・離床を進めます。",choiceNotes:["主に非転位型(Garden I・II)で選ばれます。","正解。転位型では人工骨頭置換術が一般的です。","ガイドラインでは手術療法が勧められ、保存療法はADLや生命予後が悪化しやすいとされます。","主に転子部骨折で使われる方法です。"],reference:"日本整形外科学会「大腿骨頚部/転子部骨折診療ガイドライン2021」"},{id:"cardio-001",category:"呼吸・循環器",question:"心不全患者で「安静時は無症状だが、通常の身体活動で疲労・動悸・呼吸困難が出る」状態は NYHA 分類のどれか。",choices:["I 度","II 度","III 度","IV 度"],answerIndex:1,explanation:"NYHA 分類は自覚症状による心不全の重症度分類です。I 度:身体活動に制限なし/II 度:軽度の制限があり、通常の身体活動で症状が出る/III 度:高度の制限があり、通常以下の活動で症状が出る/IV 度:安静時にも症状がある。",choiceNotes:["I 度は通常の身体活動では症状が出ません。","正解。通常の活動で症状が出るのが II 度です。","III 度は「通常以下の」軽い活動でも症状が出ます。","IV 度は安静時にも症状があります。"],reference:"日本循環器学会/日本心不全学会「急性・慢性心不全診療ガイドライン(2017年改訂版)」"},{id:"cardio-002",category:"呼吸・循環器",question:"心臓リハビリテーションで、自覚的運動強度(Borg スケール)の目安としてよく使われるのはどれか。",choices:["7〜9(非常に楽〜かなり楽)","11〜13(楽である〜ややきつい)","15〜17(きつい〜かなりきつい)","19〜20(非常にきつい)"],answerIndex:1,explanation:"心血管疾患のリハでは、Borg スケール(6〜20)で 11〜13(「楽である」〜「ややきつい」)程度が、有酸素運動の強度の目安として使われます。心拍数や嫌気性代謝閾値(AT)と合わせて判断します。",choiceNotes:["運動療法の効果を得るには弱すぎる強度です。","正解。11〜13 が目安です。","強すぎる強度で、心事故のリスクが高まります。","最大に近い強度で、リハの目安にはしません。"],reference:"日本循環器学会「2021年改訂版 心血管疾患におけるリハビリテーションに関するガイドライン」"},{id:"resp-001",category:"呼吸・循環器",question:"COPD 患者の口すぼめ呼吸の主な効果はどれか。",choices:["吸気量を増やして肺活量を高める","呼気時の気道内圧を高めて、末梢気道がつぶれるのを防ぐ","痰の粘り気を下げる","横隔膜を休ませて呼吸数を増やす"],answerIndex:1,explanation:"口すぼめ呼吸は、口をすぼめてゆっくり息を吐くことで気道内圧を高め、末梢気道の虚脱(エアトラッピング)を防ぎます。その結果、呼吸数が減り、1回換気量が増え、呼吸困難の軽減につながります。ADL動作(更衣・入浴など)では、動作と呼吸を合わせる指導が有効です。",choiceNotes:["主な目的は呼気の改善で、肺活量そのものを増やすわけではありません。","正解。呼気時の気道虚脱を防ぐのが主な効果です。","痰の粘り気を下げるのは加湿や去痰薬の役割です。","口すぼめ呼吸では呼吸数は減ります。"],reference:"日本呼吸器学会「COPD(慢性閉塞性肺疾患)診断と治療のためのガイドライン」/ 呼吸リハビリテーションマニュアル"},{id:"icu-001",category:"ICU・せん妄",question:"CAM-ICU でせん妄の評価を行えるのは、RASS が何点以上のときか。",choices:["−5 以上","−4 以上","−3 以上","0 以上"],answerIndex:2,explanation:"RASS は鎮静・興奮の程度を +4(好戦的)〜 −5(昏睡)で評価するスケールです。RASS −4・−5 は呼びかけに反応しないため CAM-ICU は評価できず、RASS −3 以上で CAM-ICU を行います。CAM-ICU は①急性発症または変動性の経過、②注意力の欠如、③意識レベルの変化、④無秩序な思考の4項目で、①+②に加えて③か④があればせん妄と判定します。",choiceNotes:["−5(昏睡)は評価できません。","−4(深い鎮静)も声かけに反応しないため評価できません。","正解。−3 以上で評価します。","RASS がマイナスでも −3 以上なら評価できます。"],reference:"日本集中治療医学会「J-PADガイドライン」(2014)/ Ely EW, et al. JAMA 2001"},{id:"icu-002",category:"ICU・せん妄",question:"ICU 獲得性筋力低下(ICU-AW)の診断に使われる MRC sum score の基準はどれか。",choices:["60点満点中 48点未満","60点満点中 30点未満","100点満点中 60点未満","100点満点中 48点未満"],answerIndex:0,explanation:"MRC sum score は、左右の肩外転・肘屈曲・手関節伸展・股屈曲・膝伸展・足背屈の計12の運動を MMT(0〜5)で評価する合計 60点満点のスコアで、48点未満を ICU-AW の目安とします。評価は覚醒して指示に従える状態で行います。",choiceNotes:["正解。60点満点で 48点未満です。","点数の基準が違います。","満点・基準ともに違います(100点満点は Barthel Index)。","満点が違います。"],reference:"De Jonghe B, et al. JAMA 2002 / Stevens RD, et al. Crit Care Med 2009"},{id:"icu-003",category:"ICU・せん妄",question:"ICU でのせん妄予防の非薬物的な関わりとして、適切でないものはどれか。",choices:["早期から離床・運動を行う","昼は明るく、夜は暗く静かにして睡眠リズムを整える","眼鏡や補聴器を使えるようにする","転落予防のため、身体抑制を予防的に積極的に行う"],answerIndex:3,explanation:"せん妄予防には、早期離床・運動、睡眠覚醒リズムの調整、眼鏡・補聴器の使用、見当識の支援(時計・カレンダー)、家族の関わりなどの非薬物的な介入が勧められています(ABCDEF バンドル)。身体抑制はせん妄の危険因子とされ、必要最小限にとどめます。",choiceNotes:["適切。早期離床はせん妄の予防・期間短縮につながります。","適切。睡眠覚醒リズムの調整は重要です。","適切。感覚入力を確保して見当識を保ちます。","正解(適切でない)。身体抑制はせん妄を悪化させる危険因子です。"],reference:"日本集中治療医学会「J-PADガイドライン」(2014)/ Devlin JW, et al. PADIS Guideline (2018)"},{id:"adl-001",category:"ADL・嚥下",question:"改訂水飲みテスト(MWST)で使う冷水の量はどれか。",choices:["1 mL","3 mL","30 mL","100 mL"],answerIndex:1,explanation:"改訂水飲みテストは、冷水 3 mL を口腔底に注いで嚥下してもらい、嚥下の有無・むせ・呼吸の変化を 1〜5点で評価します。4点以上なら最大2回繰り返し、最も悪い点を評価点とします。30 mL を使うのは窪田の水飲みテストです。",choiceNotes:["量が違います。","正解。冷水 3 mL を使います。","30 mL は「水飲みテスト(窪田)」の量です。","100 mL を使うテストは一般的ではありません。"],reference:"日本摂食嚥下リハビリテーション学会「摂食嚥下障害の評価 2019」"},{id:"adl-002",category:"ADL・嚥下",question:"反復唾液嚥下テスト(RSST)で「問題あり」と判断する基準はどれか。",choices:["30秒間に 3回未満","30秒間に 5回未満","60秒間に 3回未満","10秒間に 1回未満"],answerIndex:0,explanation:"RSST は、喉頭隆起と舌骨に指を当てて、30秒間に空嚥下が何回できるかを数えるテストです。3回未満で嚥下障害の疑いありと判断します。指示が理解できない人には行えないので、意識・認知の状態もあわせて確認します。",choiceNotes:["正解。30秒間に 3回未満が基準です。","回数の基準が違います。","時間が違います。","時間・回数ともに違います。"],reference:"日本摂食嚥下リハビリテーション学会「摂食嚥下障害の評価 2019」/ 小口和代ほか(2000)"},{id:"adl-003",category:"ADL・嚥下",question:"FIM(機能的自立度評価法)について正しいものはどれか。",choices:["全10項目で、合計 0〜100点","運動項目13・認知項目5の全18項目で、合計 18〜126点","各項目を 0〜3点の4段階で採点する","「できるADL」を評価する"],answerIndex:1,explanation:"FIM は運動項目13(セルフケア・排泄コントロール・移乗・移動)と認知項目5(コミュニケーション・社会的認知)の全18項目を、それぞれ 1〜7点の7段階で評価し、合計 18〜126点になりま
